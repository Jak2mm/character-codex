<title>Character Codex</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=Spectral:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* Layout: the official 3.5 record sheet, rebuilt as an app — inverted black label tabs over boxed fields, tabbed sections, a sticky round counter. */
:root{
  --paper:#f2f1ec; --sheet:#fbfaf7; --ink:#1b1d22; --ink-2:#4b4f58; --rule:#c9c6bc; --rule-2:#e2dfd6;
  --tab:#1b1d22; --tab-fg:#f6f4ee;
  --accent:#2d4f86; --accent-soft:#dbe3f1; --gold:#9a7424; --gold-soft:#f1e6cb;
  --good:#2f7a4a; --good-soft:#dbefe2; --warn:#a2600f; --warn-soft:#f6e6cc; --bad:#a3302b; --bad-soft:#f6dcda;
  --shadow:0 10px 30px rgba(20,24,34,.16);
  --f-label:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-ui:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-text:"Spectral",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#121419; --sheet:#1a1d23; --ink:#e9e6dd; --ink-2:#a9acb4; --rule:#3a3e47; --rule-2:#2a2e36;
  --tab:#d8d3c6; --tab-fg:#15171b;
  --accent:#8fb0e6; --accent-soft:#25324a; --gold:#d6ad5a; --gold-soft:#3a3120;
  --good:#6cc28d; --good-soft:#1d3427; --warn:#e3a650; --warn-soft:#3b2d17; --bad:#ec837c; --bad-soft:#3d2120;
  --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark;}}
:root[data-theme="dark"]{
  --paper:#121419; --sheet:#1a1d23; --ink:#e9e6dd; --ink-2:#a9acb4; --rule:#3a3e47; --rule-2:#2a2e36;
  --tab:#d8d3c6; --tab-fg:#15171b;
  --accent:#8fb0e6; --accent-soft:#25324a; --gold:#d6ad5a; --gold-soft:#3a3120;
  --good:#6cc28d; --good-soft:#1d3427; --warn:#e3a650; --warn-soft:#3b2d17; --bad:#ec837c; --bad-soft:#3d2120;
  --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark;}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.4;padding-inline:16px;padding-block:0 40px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.wrap{max-width:1240px;margin:0 auto}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--paper);padding-block:10px;border-bottom:1px solid var(--rule)}
.brand{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.brand h1{font-family:var(--f-label);font-weight:700;font-size:22px;letter-spacing:.06em;text-transform:uppercase;margin:0;white-space:nowrap}
.brand h1 b{background:var(--tab);color:var(--tab-fg);padding:0 6px;margin-right:6px}
.charbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;flex:1;min-width:0}
.charbar select{max-width:240px}
.sync{font-size:12px;color:var(--ink-2);font-family:var(--f-label);letter-spacing:.06em;text-transform:uppercase}
.sync.ok::before{content:"● ";color:var(--good)} .sync.busy::before{content:"● ";color:var(--warn)} .sync.local::before{content:"● ";color:var(--ink-2)}
.roundchip{display:flex;align-items:stretch;border:1px solid var(--rule);background:var(--sheet);min-width:250px}
.rc-round{display:flex;flex-direction:column;align-items:stretch;border-right:1px solid var(--rule-2);flex:none}
.roundchip .lab{background:var(--tab);color:var(--tab-fg);font-family:var(--f-label);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:11px;padding:3px 8px;text-align:center}
.rc-num{display:flex;align-items:center;justify-content:center;flex:1;padding:0 6px 0 0}
.rc-num #rPrev{padding:2px 6px}
.roundchip .num{font-family:var(--f-label);font-weight:700;font-size:24px;min-width:2ch;text-align:center;font-variant-numeric:tabular-nums}
.rc-turn{display:flex;align-items:center;gap:6px;flex:1;min-width:0;padding:3px 4px 3px 8px}
.rc-lines{flex:1;min-width:0;cursor:pointer}
.rc-line{display:flex;align-items:baseline;gap:6px;font-size:14px;line-height:1.3;min-width:0}
.rc-line .k{font-family:var(--f-label);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:11px;color:var(--ink-2);width:3.6em;flex:none}
.rc-line b{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;max-width:16em}
.rc-line b.me{color:var(--accent)} .rc-line b.none{color:var(--ink-2);font-weight:400}
.rc-line.nx{font-size:13px;color:var(--ink-2)} .rc-line.nx b{font-weight:600}
.rc-init{font-size:11px;font-variant-numeric:tabular-nums;color:var(--ink-2);border:1px solid var(--rule);padding:0 4px;flex:none}
.rc-empty{border:0;background:transparent;padding:2px 0;font-size:13px;color:var(--ink-2);cursor:pointer;text-align:left}
.rc-empty:hover,.rc-lines:hover b{text-decoration:underline}

/* sidebar menu */
:root{--sidew:224px}
.nav-tog{padding:4px 7px;line-height:0}
.nav-tog[aria-expanded="true"]{background:var(--tab);color:var(--tab-fg);border-color:var(--tab)}
.sidebar{position:fixed;left:0;bottom:0;top:var(--toph,110px);width:var(--sidew);background:var(--sheet);border-right:1px solid var(--rule);overflow-y:auto;z-index:25;padding:8px 0 24px;display:none;overscroll-behavior:contain}
body.side-open .sidebar{display:block}
body.side-open #main{margin-left:max(calc(var(--sidew) + 4px),calc((100% - 1240px) / 2))}
.nv-title{display:flex;align-items:center;justify-content:space-between;padding:2px 8px 6px 14px;font-family:var(--f-label);font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:11px;color:var(--ink-2)}
.nv-list,.nv-sub{list-style:none;margin:0;padding:0}
.nv-head{display:flex;align-items:stretch}
.nv-link{display:flex;align-items:center;gap:6px;width:100%;border:0;border-left:4px solid transparent;background:transparent;text-align:left;cursor:pointer;color:var(--ink);padding:8px 10px 8px 12px;font-family:var(--f-label);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:14px}
.nv-link>span:first-child{flex:1;min-width:0}
.nv-link:hover{background:var(--rule-2)}
.nv-top[aria-current="page"]{border-left-color:var(--tab);background:var(--rule-2);font-weight:700}
.nv-group.open .nv-top[aria-current="page"]{background:transparent}
.nv-caret{border:0;background:transparent;cursor:pointer;color:var(--ink-2);width:36px;flex:none;font-size:13px}
.nv-caret:hover{background:var(--rule-2);color:var(--ink)}
.nv-caret span{display:inline-block;transition:transform .15s}
.nv-group.open .nv-caret span{transform:rotate(90deg)}
.nv-child{padding:6px 10px 6px 30px;font-size:13px;letter-spacing:.06em;color:var(--ink-2)}
.nv-child[aria-current="page"]{border-left-color:var(--tab);background:var(--tab);color:var(--tab-fg);font-weight:700}
.nv-link .badge{display:inline-block;min-width:18px;padding:0 4px;font-size:11px;background:var(--gold);color:var(--sheet);border-radius:9px;text-align:center;letter-spacing:0}
.nv-link .n{display:inline-block;min-width:18px;padding:0 5px;font-size:11px;letter-spacing:0;border-radius:9px;background:var(--rule-2);color:var(--ink-2);text-align:center}
.nv-child[aria-current="page"] .n{background:var(--gold);color:var(--sheet)}
.nv-close{font-size:16px;padding:0 8px}
.side-scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:44}
@media (max-width:900px){
  .sidebar{display:block;top:0;z-index:45;width:min(290px,86vw);transform:translateX(-102%);transition:transform .2s ease;padding-top:calc(10px + env(safe-area-inset-top,0px));box-shadow:none;visibility:hidden}
  body.side-open .sidebar{transform:none;box-shadow:4px 0 18px rgba(0,0,0,.25);visibility:visible}
  body.side-open #main{margin-left:auto}
}
@media (prefers-reduced-motion:reduce){.sidebar,.nv-caret span{transition:none}}
@media print{.sidebar,.side-scrim,.nav-tog,.rc-turn{display:none!important} body.side-open #main{margin-left:auto}}
.prc-link{font-weight:700;border-left:3px solid var(--gold)!important}
.prc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:12px}
.prc-card{border:1px solid var(--rule);padding:10px 12px;background:var(--sheet)}
.prc-card.can{border-color:var(--good,#2e7d4f);box-shadow:inset 3px 0 0 var(--good,#2e7d4f)}
.prc-h{display:flex;justify-content:space-between;align-items:center;gap:8px}.prc-h h3{margin:0;font-family:var(--f-label);font-size:19px;letter-spacing:.03em}
.prc-d{margin:6px 0}
.prc-req{list-style:none;margin:0 0 8px;padding:0;font-size:13.5px}.prc-req li{display:flex;gap:6px;align-items:baseline;padding:2px 0}
.rq{display:inline-block;width:16px;text-align:center;font-weight:700;flex:none}.rq.ok{color:var(--good,#2e7d4f)}.rq.no{color:var(--bad)}.rq.maybe{color:var(--warn)}
.prc-tbl td,.prc-tbl th{white-space:nowrap}
.rs-cards{display:grid;gap:6px;margin-top:4px}
.rs-card{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--rule);padding:8px 10px;cursor:pointer;background:var(--sheet)}
.rs-card:has(input:checked){border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent);background:var(--accent-soft)}
.rs-card.off{opacity:.55;cursor:not-allowed}
.rs-card input{margin-top:3px;width:auto}
.rs-card .hint{display:block;margin-top:2px}
.rs-badge{font-size:11px}
.sheet-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}
.sheet-grid>.sheet-sec{min-width:0}
.sheet-grid>.sp-full{grid-column:1/-1}
@media (max-width:900px){.sheet-grid{grid-template-columns:minmax(0,1fr)}}
.sheet-sec.collapsed>section.panel>:not(.ph){display:none}
.sp-col{min-width:28px;padding:2px 6px;font-size:13px}
.sp-custom{margin-left:auto;align-self:center}
.sp-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:5px 8px;background:var(--accent-soft);border:1px dashed var(--accent);border-bottom:none;font-family:var(--f-label);letter-spacing:.05em;text-transform:uppercase;font-size:13px}
.sp-bar .sp-tools{display:flex;gap:4px;flex-wrap:wrap;align-items:center;text-transform:none;letter-spacing:0}
.sheet-grid.editing>.sheet-sec>section.panel{outline:1px dashed var(--accent);outline-offset:-1px;max-height:260px;overflow:hidden;position:relative}
.sheet-grid.editing>.sheet-sec>section.panel::after{content:"";position:absolute;inset:auto 0 0 0;height:60px;background:linear-gradient(transparent,var(--sheet));pointer-events:none}
.sp-hidden>section.panel{opacity:.4;filter:grayscale(1)}
.sp-hidden .sp-bar{border-style:dotted;opacity:.85}
.sp-edit-banner{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 12px;margin-bottom:12px;background:var(--accent-soft);border:1px solid var(--accent);font-size:14px}
.sp-foot{margin:10px 0 0}
.brand h1{cursor:pointer}
.start{position:fixed;inset:0;z-index:50;overflow-y:auto;background:
  radial-gradient(ellipse at 50% 0%,var(--accent-soft),transparent 60%),
  repeating-linear-gradient(60deg,transparent 0 38px,var(--rule-2) 38px 39px),
  repeating-linear-gradient(-60deg,transparent 0 38px,var(--rule-2) 38px 39px),var(--paper)}
body.st-open{overflow:hidden}
.st-wrap{min-height:100%;display:flex;flex-direction:column;align-items:center;padding:clamp(20px,6vh,64px) 16px 18px}
.st-brand{text-align:center;color:var(--ink);margin-bottom:clamp(18px,4vh,36px)}
.start-logo{width:clamp(64px,12vw,92px);height:auto;color:var(--gold);display:block;margin:0 auto 10px}
.st-brand h1{font-family:var(--f-label);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:clamp(30px,6vw,48px);margin:0;line-height:1.05}
.st-brand p{margin:6px 0 0;color:var(--ink-2);font-family:var(--f-text);font-style:italic}
.st-body{width:100%;max-width:560px;flex:1}
.st-menu{display:grid;gap:10px}
.st-item{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;text-align:left;cursor:pointer;padding:14px 18px;border:1px solid var(--ink);background:var(--sheet);color:var(--ink);box-shadow:3px 3px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.st-item b{font-family:var(--f-label);font-size:22px;letter-spacing:.1em;text-transform:uppercase}
.st-item>span{color:var(--ink-2);font-size:14px}
.st-item:hover,.st-item:focus-visible{transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--gold);outline:none}
.st-item:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--ink)}
.st-continue{flex-direction:row;align-items:center;gap:14px;background:var(--tab);color:var(--tab-fg);border-color:var(--tab)}
.st-continue b{color:var(--tab-fg)!important;opacity:1}
.st-continue .st-cont-t{display:flex;flex-direction:column;gap:2px;min-width:0}
.st-continue .st-cont-t>span{color:var(--tab-fg);opacity:.85;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st-continue .st-rs{font-size:12.5px!important;opacity:.7!important}
.st-pic{width:56px;height:56px;flex:none;object-fit:cover;border:2px solid var(--gold);background:var(--rule-2)}
.st-pic.big{width:72px;height:72px}
.st-ph{display:flex;align-items:center;justify-content:center;font-family:var(--f-label);font-weight:700;font-size:26px;color:var(--ink-2)}
.st-continue .st-ph{background:transparent;color:var(--tab-fg)}
.st-page{background:var(--sheet);border:1px solid var(--ink);box-shadow:3px 3px 0 var(--ink);padding:12px 14px 16px}
.st-head{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;margin-bottom:10px}
.st-head h2{margin:0;text-align:center;font-family:var(--f-label);letter-spacing:.12em;text-transform:uppercase;font-size:20px}
.st-tools{gap:6px;margin-bottom:10px;flex-wrap:wrap}.st-tools input{flex:1;min-width:160px}.st-tools select{width:auto}
.st-cards{display:grid;gap:8px;max-height:min(58vh,560px);overflow-y:auto;padding:2px}
.st-card{display:flex;gap:12px;align-items:center;text-align:left;width:100%;padding:8px;border:1px solid var(--rule);background:var(--paper);cursor:pointer;color:var(--ink)}
.st-card:hover,.st-card:focus-visible{border-color:var(--accent);background:var(--accent-soft);outline:none}
.st-card.cur{box-shadow:inset 3px 0 0 var(--gold)}
.st-card-t{display:flex;flex-direction:column;gap:2px;min-width:0}
.st-card-t b{font-size:17px}.st-card-t>span{font-size:13.5px}
.st-card-m{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.st-opt{border-top:1px solid var(--rule-2);padding:10px 0 4px}.st-opt:first-of-type{border-top:none}
.st-opt h3{margin:0 0 6px;font-family:var(--f-label);letter-spacing:.1em;text-transform:uppercase;font-size:15px}
.st-foot{width:100%;max-width:560px;display:flex;justify-content:space-between;gap:8px;margin-top:18px;font-size:12px;color:var(--ink-2)}
@media (max-width:520px){.st-item b{font-size:19px}.st-pic{width:46px;height:46px}.st-pic.big{width:56px;height:56px}}
.subtabs{display:flex;flex-wrap:wrap;gap:4px;margin:0 0 12px;padding-bottom:6px;border-bottom:2px solid var(--tab)}
.subtabs button{border:1px solid var(--tab);background:transparent;color:var(--ink);font-family:var(--f-label);font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:15px;padding:5px 12px;cursor:pointer;white-space:nowrap}
.subtabs button:hover{background:var(--rule-2)}
.subtabs button[aria-selected="true"]{background:var(--tab);color:var(--tab-fg)}
.subtabs .n{display:inline-block;min-width:18px;margin-left:6px;padding:0 5px;font-size:11px;letter-spacing:0;border-radius:9px;background:var(--rule-2);color:var(--ink-2);text-align:center}
.subtabs button[aria-selected="true"] .n{background:var(--gold);color:var(--sheet)}
.comp-sb{margin:0}
.comp .bchips .bchip[data-ref]{text-decoration:underline dotted}
@media (max-width:520px){.subtabs button{font-size:13px;padding:5px 9px}}

/* controls */
.btn{border:1px solid var(--rule);background:var(--sheet);padding:5px 10px;cursor:pointer;font-family:var(--f-label);font-weight:600;letter-spacing:.05em;text-transform:uppercase;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--ink-2)}
a.btn{color:inherit;text-decoration:none;display:inline-block}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--sheet)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--sheet)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{color:var(--bad)}
.btn.sm{padding:2px 7px;font-size:12px}
input[type=text],input[type=search],input[type=date],input[type=number],input:not([type]),select,textarea{background:var(--sheet);border:1px solid var(--rule);padding:5px 7px;border-radius:0;width:100%;min-width:0}
input[type=number]{font-variant-numeric:tabular-nums;text-align:center;-moz-appearance:textfield}
input[type=number]::-webkit-inner-spin-button{opacity:.4}
textarea{resize:vertical;min-height:70px;font-family:var(--f-text);font-size:15px;line-height:1.5}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 2px var(--accent-soft)}

/* sheet structures */
main{padding-block:16px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.panel{background:var(--sheet);border:1px solid var(--rule);min-width:0}
.ph{display:flex;align-items:center;gap:8px;justify-content:space-between;border-bottom:1px solid var(--rule)}
.ph h2{margin:0;background:var(--tab);color:var(--tab-fg);font-family:var(--f-label);font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:15px;padding:5px 10px}
.ph .tools{display:flex;gap:6px;padding:3px 6px;flex-wrap:wrap;justify-content:flex-end}
.pb{padding:10px}
.fields{display:grid;gap:8px 10px;grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
.f{display:flex;flex-direction:column;gap:2px;min-width:0}
.f.wide{grid-column:span 2}
.f label,.cap{font-family:var(--f-label);font-weight:600;font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2)}
.hint{font-size:12.5px;color:var(--ink-2)}
.tbl-wrap{overflow-x:auto}
table.st{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
table.st th{font-family:var(--f-label);font-weight:600;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);text-align:center;padding:4px 4px;border-bottom:1px solid var(--rule);white-space:nowrap}
table.st th:first-child,table.st td:first-child{text-align:left}
table.st td{padding:3px 4px;border-bottom:1px solid var(--rule-2);text-align:center;vertical-align:middle}
table.st td input[type=number]{width:56px;padding:3px 2px}
table.st tr:last-child td{border-bottom:none}
.tag{display:inline-block;background:var(--tab);color:var(--tab-fg);font-family:var(--f-label);font-weight:700;letter-spacing:.08em;padding:4px 8px;font-size:14px;min-width:54px;text-align:left;text-transform:uppercase}
.out{display:inline-flex;align-items:center;justify-content:center;min-width:44px;height:30px;padding:0 6px;border:2px solid var(--ink);font-family:var(--f-label);font-weight:700;font-size:18px;font-variant-numeric:tabular-nums;background:var(--sheet)}
.out.sm{min-width:36px;height:26px;font-size:15px;border-width:1px}
.out.roll{cursor:pointer}
.out.roll:hover{background:var(--accent-soft)}
.out.temp{border-style:dashed;color:var(--accent)}
.big{font-family:var(--f-label);font-weight:700;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.ref{cursor:help;border-bottom:1px dotted var(--ink-2);text-decoration:none}
.ref:hover{color:var(--accent);border-bottom-color:var(--accent)}
.ref.custom{border-bottom-style:dashed;border-bottom-color:var(--gold)}
.cs-dot{display:inline-block;width:12px;height:12px;border:1.5px solid var(--ink-2);vertical-align:middle}
.cs-dot.on{background:var(--ink);border-color:var(--ink)}
.pill{display:inline-block;font-family:var(--f-label);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:11.5px;padding:1px 7px;border-radius:9px;background:var(--rule-2);color:var(--ink-2);white-space:nowrap}
