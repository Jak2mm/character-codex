# Builds the Windows installer, the Mac app and the Android app, then publishes them as a GitHub Release.
# GitHub → Actions → "Build Windows, Mac and Android apps" → Run workflow → Run (the version comes from src/changelog.json unless you type one).
name: Build Windows, Mac and Android apps

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number (leave blank to use the newest version in src/changelog.json)"
        required: false
        default: ""
      app_dir:
        description: "Folder holding index.html and native/ (leave blank to find it automatically)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  locate:
    runs-on: ubuntu-latest
    outputs:
      dir: ${{ steps.find.outputs.dir }}
      version: ${{ steps.find.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: find
        shell: bash
        run: |
          d="${{ github.event.inputs.app_dir }}"
          if [ -z "$d" ]; then
            if [ -d native ]; then d=.
            elif [ -d app/native ]; then d=app
            fi
          fi
          if [ -z "$d" ] || [ ! -f "$d/index.html" ] || [ ! -d "$d/native" ]; then echo "::error::Could not find a folder with index.html and native/. Enter it in 'app_dir'."; exit 1; fi
          echo "Using app folder: $d"; echo "dir=$d" >> "$GITHUB_OUTPUT"
          v="${{ github.event.inputs.version }}"
          if [ -z "$v" ]; then v=$(node -p "require('./$d/version.json').version"); fi
          echo "Version: $v"; echo "version=$v" >> "$GITHUB_OUTPUT"

  windows:
    needs: locate
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: ${{ needs.locate.outputs.dir }}/native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - name: Copy the app into native/www
        run: node prepare.mjs
      - name: Set the version
        run: |
          node -e "const f='tauri/src-tauri/tauri.conf.json',fs=require('fs'),j=JSON.parse(fs.readFileSync(f));j.version='${{ needs.locate.outputs.version }}';fs.writeFileSync(f,JSON.stringify(j,null,2))"
      - name: Build the Windows installers
        working-directory: ${{ needs.locate.outputs.dir }}/native/tauri
        run: |
          npm install --no-audit --no-fund
          npx tauri build
      - name: Collect installers
        run: |
          OUT="$(git rev-parse --show-toplevel)/out"; mkdir -p "$OUT"
          cp tauri/src-tauri/target/release/bundle/nsis/*.exe "$OUT/Character-Codex-${{ needs.locate.outputs.version }}-Windows-setup.exe"
          cp tauri/src-tauri/target/release/bundle/msi/*.msi "$OUT/Character-Codex-${{ needs.locate.outputs.version }}-Windows.msi"
          ls -l "$OUT"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*
          if-no-files-found: error

  mac:
    needs: locate
    runs-on: macos-latest
    defaults:
      run:
        shell: bash
        working-directory: ${{ needs.locate.outputs.dir }}/native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Copy the app into native/www
        run: node prepare.mjs
      - name: Set the version
        run: |
          node -e "const f='tauri/src-tauri/tauri.conf.json',fs=require('fs'),j=JSON.parse(fs.readFileSync(f));j.version='${{ needs.locate.outputs.version }}';fs.writeFileSync(f,JSON.stringify(j,null,2))"
      - name: Build the Mac app (one app for Apple silicon and Intel Macs)
        working-directory: ${{ needs.locate.outputs.dir }}/native/tauri
        run: |
          npm install --no-audit --no-fund
          npx tauri build --target universal-apple-darwin --bundles app,dmg
      - name: Collect the disk image
        run: |
          OUT="$(git rev-parse --show-toplevel)/out"; mkdir -p "$OUT"
          cp tauri/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg "$OUT/Character-Codex-${{ needs.locate.outputs.version }}-Mac.dmg"
          ls -l "$OUT"
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: out/*
          if-no-files-found: error

  android:
    needs: locate
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ${{ needs.locate.outputs.dir }}/native/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Create the Android project
        run: |
          npm install --no-audit --no-fund
          node ../prepare.mjs
          npx cap add android
          npx capacitor-assets generate --android
          npx cap sync android
      - name: Set the version
        run: |
          sed -i -E 's/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName "[^"]*"/versionName "${{ needs.locate.outputs.version }}"/' android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle
      - name: Build the APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Collect the APK
        run: |
          OUT="$(git rev-parse --show-toplevel)/out"; mkdir -p "$OUT"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$OUT/Character-Codex-${{ needs.locate.outputs.version }}-Android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/*
          if-no-files-found: error

  release:
    needs: [locate, windows, mac, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.locate.outputs.version }}
          name: Character Codex ${{ needs.locate.outputs.version }}
          files: dist/*
          body: |
            **Windows:** download `...-Windows-setup.exe` and run it. (If Windows SmartScreen warns about an unknown publisher, choose *More info → Run anyway*.)
            **Mac:** download `...-Mac.dmg`, open it and drag *Character Codex* into *Applications*. The first time you open it, macOS says it can't check the developer: open *System Settings → Privacy & Security*, scroll down and click *Open Anyway* (on older macOS, right-click the app and choose *Open*). Works on Apple silicon and Intel Macs.
            **Android:** download `...-Android.apk` on your phone and open it. Android will ask you to allow installing apps from your browser or Files app.
            **Any device:** you can also use it in your browser, or install it from the website with the *Install app* button.

            Your characters stay on each device. Use **Export** and **Import** to move them between devices, or, in the Windows and Mac apps, choose a **Save location** on the Options page (a NAS, Dropbox, OneDrive or iCloud Drive folder) to share them between computers.
